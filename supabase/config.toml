[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true

[edge_runtime]
enabled = true

# ── Edge Functions: bramka JWT per-funkcja ──────────────────────────────────
# Domyślnie Supabase ustawia verify_jwt=true. Deploy bez flagi --no-verify-jwt
# respektuje poniższe wpisy. Endpointy per-user wymagają JWT (user_id z `sub`),
# funkcje cron + smoke-test zostają publiczne (woła je pg_cron / CI bez tokena usera).
[functions.portfolio]
verify_jwt = true

[functions.last-visit]
verify_jwt = true

[functions.assets]
verify_jwt = true

[functions.snapshot-dates]
verify_jwt = true

[functions.value-history]
verify_jwt = true

[functions.holdings]
verify_jwt = true

[functions.transactions]
verify_jwt = true

[functions.fetch-prices]
verify_jwt = false

[functions.fetch-metals]
verify_jwt = false

[functions.fetch-crypto]
verify_jwt = false

[functions.fetch-eod]
verify_jwt = false

[functions.sync-catalog]
verify_jwt = false

[functions.snapshot-portfolio]
verify_jwt = false

[functions.smoke-test]
verify_jwt = false

[analytics]
enabled = false

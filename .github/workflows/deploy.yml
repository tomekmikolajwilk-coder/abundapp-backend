name: Deploy to Supabase

on:
  push:
    branches:
      - main

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run unit tests (czysta logika fetch-prices)
        run: deno test supabase/functions/fetch-prices/

  deploy:
    runs-on: ubuntu-latest
    needs: unit-test  # nie deployuj jeśli logika nie przechodzi testów
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy  # czeka na zakończenie joba deploy
    steps:
      - name: Run smoke tests
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            https://mrcjjyaljautuylpsssp.supabase.co/functions/v1/smoke-test)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "$BODY" | jq .
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Smoke tests failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ All smoke tests passed"
